name: Translate to Japanese

on:
  push:
    branches:
      - release-5.9
      - release-5.10
      - release-[6-9].[0-9]
      - release-[6-9].[0-9][0-9]
    paths:
      - 'en_US/**'
  workflow_dispatch:

concurrency:
  group: translate-ja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    if: github.repository_owner == 'emqx'
    steps:
      - name: Check branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          current_branch="${GITHUB_REF#refs/heads/}"
          if [[ ! "$current_branch" =~ ^release-(5\.9|5\.10|[6-9]\.[0-9]{1,2})$ ]]; then
            echo "Error: Manual runs are only allowed on release-5.9, release-5.10, or release-[6-9].x branches"
            echo "Current branch: $current_branch"
            exit 1
          fi
          echo "Manual run approved on branch: $current_branch"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ vars.AUTH_APP_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Get current branch name
        id: get-branch
        run: |
          echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Copy assets from en_US to ja_JP
        run: |
          cp -r en_US/* ja_JP/
          git restore -- "ja_JP/**/*.md" || true

      - name: Get current English docs commit hash
        id: current-hash
        run: |
          current_hash=$(git log -1 --format="%H" -- en_US/)
          echo "current_hash=$current_hash" >> $GITHUB_OUTPUT
          echo "Current en_US hash: $current_hash"

      - name: Get last translation commit hash
        id: last-hash
        run: |
          if [ ! -f "ja_JP/last_translation_commit" ]; then
            echo "ja_JP/last_translation_commit not found, falling back to full translation"
            echo "full_translation=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          last_hash=$(cat ja_JP/last_translation_commit | tr -d '\n')
          if ! git cat-file -e "$last_hash" 2>/dev/null; then
            echo "Last translation commit $last_hash does not exist in history, falling back to full translation"
            echo "full_translation=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "last_hash=$last_hash" >> $GITHUB_OUTPUT
          echo "full_translation=false" >> $GITHUB_OUTPUT
          echo "Last translation hash: $last_hash"

      - name: Generate directory.json
        run: |
          uv run --with pyyaml gen.py ce | tee directory.json > /dev/null

      - name: Get modified markdown files
        id: modified-files
        run: |
          if [ "${{ steps.last-hash.outputs.full_translation }}" == "true" ]; then
            echo "Running full translation: listing files from directory.json (ja section)"
            modified_files=$(uv run .github/scripts/list_translation_targets.py directory.json)
          else
            modified_files=$(git diff --name-only --diff-filter=ACMR ${{ steps.last-hash.outputs.last_hash }} ${{ steps.current-hash.outputs.current_hash }} -- 'en_US/**/*.md' || echo "")
          fi

          if [ -z "$modified_files" ]; then
            echo "No markdown files to translate, exiting workflow"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          else
            file_count=$(echo "$modified_files" | wc -l)
            echo "Found $file_count markdown files to translate:"
            echo "$modified_files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$modified_files" > modified_files.txt
          fi

      - name: Translate modified files
        if: steps.modified-files.outputs.has_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
        run: |
          echo "./dir.yaml" >> modified_files.txt
          uv run .github/scripts/translate_to_ja.py modified_files.txt

          uv run .github/scripts/remove_unused.py directory.json $(pwd) ja_JP

      - name: Update last translation commit hash
        if: steps.modified-files.outputs.has_changes == 'true'
        run: |
          echo "${{ steps.current-hash.outputs.current_hash }}" > ja_JP/last_translation_commit

      - name: Create new branch and commit changes
        if: steps.modified-files.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          new_branch="translate-ja-${{ steps.current-hash.outputs.current_hash }}"
          git checkout -b "$new_branch"

          rm -f modified_files.txt
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          last_short=$(echo "${{ steps.last-hash.outputs.last_hash }}" | cut -c1-7)
          current_short=$(echo "${{ steps.current-hash.outputs.current_hash }}" | cut -c1-7)
          branch_name="${{ steps.get-branch.outputs.branch_name }}"
          if [ -z "$last_short" ]; then
            range_desc="initial..${current_short}"
          else
            range_desc="${last_short}..${current_short}"
          fi
          commit_msg="docs(ja): [${branch_name}] sync translations ${range_desc}"

          git commit -m "$commit_msg"
          git push origin "$new_branch"
          echo "new_branch=$new_branch" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.modified-files.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          last_short=$(echo "${{ steps.last-hash.outputs.last_hash }}" | cut -c1-7)
          current_short=$(echo "${{ steps.current-hash.outputs.current_hash }}" | cut -c1-7)
          branch_name="${{ steps.get-branch.outputs.branch_name }}"
          if [ -z "$last_short" ]; then
            range_desc="initial..${current_short}"
            english_changes_url="https://github.com/emqx/emqx-docs/commit/${{ steps.current-hash.outputs.current_hash }}"
          else
            range_desc="${last_short}..${current_short}"
            english_changes_url="https://github.com/emqx/emqx-docs/compare/${{ steps.last-hash.outputs.last_hash }}...${{ steps.current-hash.outputs.current_hash }}"
          fi

          pr_title="docs(ja): [${branch_name}] sync translations ${range_desc}"
          pr_body=$(cat <<EOF
          Syncs Japanese translations for English documentation changes in \`${range_desc}\`.

          - **Source diff**: ${english_changes_url}
          - **Source branch**: \`${branch_name}\`
          - Files under \`en_US/changes/\` are copied as-is without translation.

          Generated by [.github/workflows/translate_to_ja.yaml](.github/workflows/translate_to_ja.yaml).

          **Note**: Please delete the branch after merging this PR.
          EOF
          )

          gh pr create \
            --title "$pr_title" \
            --body "$pr_body" \
            --base "${{ steps.get-branch.outputs.branch_name }}" \
            --head "${{ env.new_branch }}" \
            --reviewer "Meggielqk"
