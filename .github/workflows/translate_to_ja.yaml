name: Auto Translate to Japanese

on:
  push:
    branches:
      - release-5.9
      - release-5.10
    paths:
      - 'en_US/**'
  workflow_dispatch:

concurrency:
  group: translate-ja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    if: github.repository_owner == 'emqx'
    steps:
      - name: Check branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          current_branch="${GITHUB_REF#refs/heads/}"
          if [[ "$current_branch" != "release-5.9" && "$current_branch" != "release-5.10" ]]; then
            echo "Error: Manual runs are only allowed on release-5.9 or release-5.10 branches"
            echo "Current branch: $current_branch"
            exit 1
          fi
          echo "Manual run approved on branch: $current_branch"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ vars.AUTH_APP_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Get current branch name
        id: get-branch
        run: |
          echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Copy assets from en_US to ja_JP
        run: |
          cp -r en_US/* ja_JP/
          git restore "ja_JP/*.md" || true
          git restore "ja_JP/**/*.md" || true

      - name: Get current English docs commit hash
        id: current-hash
        run: |
          current_hash=$(git log -1 --format="%H" -- en_US/)
          echo "current_hash=$current_hash" >> $GITHUB_OUTPUT
          echo "Current en_US hash: $current_hash"

      - name: Get last translation commit hash
        id: last-hash
        run: |
          if [ ! -f "ja_JP/last_translation_commit" ]; then
            echo "Error: ja_JP/last_translation_commit file not found"
            echo "Please run initial translation manually first"
            exit 1
          fi
          last_hash=$(cat ja_JP/last_translation_commit | tr -d '\n')
          echo "last_hash=$last_hash" >> $GITHUB_OUTPUT
          echo "Last translation hash: $last_hash"

      - name: Get modified markdown files
        id: modified-files
        run: |
          if ! git cat-file -e "${{ steps.last-hash.outputs.last_hash }}" 2>/dev/null; then
            echo "Error: Last translation commit hash ${{ steps.last-hash.outputs.last_hash }} does not exist"
            exit 1
          fi

          modified_files=$(git diff --name-only ${{ steps.last-hash.outputs.last_hash }} ${{ steps.current-hash.outputs.current_hash }} -- 'en_US/**/*.md' || echo "")

          if [ -z "$modified_files" ]; then
            echo "No markdown files to translate, exiting workflow"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          else
            file_count=$(echo "$modified_files" | wc -l)
            echo "Found $file_count markdown files to translate:"
            echo "$modified_files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$modified_files" > modified_files.txt
          fi

      - name: Translate modified files
        if: steps.modified-files.outputs.has_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
        run: |
          echo "Starting translation process..."
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "Translating: $file"
              python3 .github/scripts/translate_to_ja.py "$file"
            fi
          done < modified_files.txt
          python3 .github/scripts/translate_to_ja.py ./dir.yaml

          ./gen.py ce | tee directory.json
          python3 .github/scripts/remove_unused.py directory.json $(pwd)
          git restore '*.md' ':!ja_JP/**/*.md'

      - name: Update last translation commit hash
        if: steps.modified-files.outputs.has_changes == 'true'
        run: |
          echo "${{ steps.current-hash.outputs.current_hash }}" > ja_JP/last_translation_commit

      - name: Create new branch and commit changes
        if: steps.modified-files.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          new_branch="translate-ja-${{ steps.current-hash.outputs.current_hash }}"
          git checkout -b "$new_branch"

          rm -f modified_files.txt
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          last_short=$(echo "${{ steps.last-hash.outputs.last_hash }}" | cut -c1-7)
          current_short=$(echo "${{ steps.current-hash.outputs.current_hash }}" | cut -c1-7)
          commit_msg="docs(ja): sync translations from ${last_short} to ${current_short}"

          git commit -m "$commit_msg"
          git push origin "$new_branch"
          echo "new_branch=$new_branch" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.modified-files.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          last_short=$(echo "${{ steps.last-hash.outputs.last_hash }}" | cut -c1-7)
          current_short=$(echo "${{ steps.current-hash.outputs.current_hash }}" | cut -c1-7)

          pr_title="docs(ja): sync translations from ${last_short} to ${current_short}"
          pr_body="Automatically sync Japanese translations for changes in en_US documentation.

          English Changes: https://github.com/emqx/emqx-docs/compare/${{ steps.last-hash.outputs.last_hash }}...${{ steps.current-hash.outputs.current_hash }}

          This PR was automatically generated by the translation workflow.

          **Note**: Please delete the branch after merging this PR."

          gh pr create \
            --title "$pr_title" \
            --body "$pr_body" \
            --base "${{ steps.get-branch.outputs.branch_name }}" \
            --head "${{ env.new_branch }}" \
            --reviewer "SuncNoob"
