name: Migration Pilot Checks

on:
  pull_request:
    paths:
      - gen.py
      - .github/scripts/markdown_title.py
      - .github/scripts/markdown_sections.py
      - .github/scripts/prepare_migration_pilot.py
      - .github/scripts/check_migration_pilot_html.py
      - .github/workflows/migration-pilot.yaml
      - tests/**

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p 'test_migration_*.py' -v
