name: Migration Pilot Checks

on:
  pull_request:
    paths:
      - gen.py
      - .github/workflows/deploy_docs.yaml
      - .github/scripts/markdown_title.py
      - .github/scripts/markdown_sections.py
      - .github/scripts/expand_shared_sections.py
      - .github/scripts/prepare_migration_pilot.py
      - .github/scripts/check_migration_pilot_html.py
      - .github/workflows/migration-pilot.yaml
      - tests/**
      - dir.yaml
      - nav.yaml
      - en_US/index.md
      - en_US/get-started/getting-started.md
      - en_US/get-started/messaging/publish-and-subscribe.md
      - en_US/get-started/mqtt-basics.md
      - en_US/get-started/quick-start.md
      - en_US/get-started/connect-client.md
      - en_US/get-started/publish-subscribe.md
      - en_US/get-started/topics-and-wildcards.md
      - en_US/get-started/qos.md
      - en_US/get-started/password-authentication.md
      - en_US/get-started/topic-permissions.md
      - en_US/develop/authentication/**
      - en_US/develop/authorization/**
      - en_US/guides/access-control/**
      - en_US/guides/api.md
      - en_US/guides/configuration/configuration.md
      - en_US/guides/network/emqx-mqtt-tls.md
      - en_US/develop/clients/test-clients.md
      - en_US/develop/clients/assets/**
      - en_US/develop/mqtt/basics.md
      - en_US/develop/mqtt/wildcard-subscriptions.md

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
